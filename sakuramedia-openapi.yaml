openapi: 3.1.0
info:
  title: SakuraMedia API
  version: 0.9.8
  description: '上游 tinypinglite/sakuramediabe v0.9.8（main 分支 5684ffe，2026-10-09）的完整接口文档。

    共 186 个接口，覆盖 8 大域：影片目录、合集管理、发现推荐、文件服务、播放、系统管理、传输任务、视频。

    用途：后端 Rust 重构（sakuramediabe-rs）测试对照——每个接口的请求/响应结构、鉴权要求、预期结果均可作为重构验收标准。

    鉴权：除 7 个公开接口外全部需要 `Authorization: Bearer <token>`（JWT 或 sk- 前缀 API Key）。'
servers:
- url: http://127.0.0.1:8003
  description: 本地默认
security:
- BearerAuth: []
tags:
- name: catalog
  description: 影片目录：演员、影片、订阅、标签、观看历史
- name: collections
  description: 合集管理：片段合集、时刻合集、播放列表
- name: discovery
  description: 发现推荐：每日推荐、热门、图像搜索、榜单
- name: files
  description: 文件服务：图片与字幕文件直链
- name: playback
  description: 播放：媒体、片段、媒体库、打点
- name: system
  description: 系统管理：账号、鉴权、配置、任务、插件、状态
- name: transfers
  description: 传输任务：下载、导入、迁移
- name: videos
  description: 视频：视频合集与视频条目
